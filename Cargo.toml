[package]
name = "omagari"
version = "0.19.0"
edition = "2024"

[dependencies]
rand = "0.9.1"
serde = "1.0.228"
ron = "0.10"
# Reports fields of project files the format does not know (typos) as
# warnings instead of ignoring them silently.
serde_ignored = "0.1"
bevy = { version = "0.19.1" }
bevy_hanabi = { version = "0.19", features = ["3d"] }
bevy_egui = { version = "0.42", optional = true }
bevy_panorbit_camera = { version = "0.35", optional = true }
regex = { version = "1.11.1", optional = true }
serde_json = { version = "1", optional = true }
# Editor only: decoding textures for previews and channel extraction (the
# same crate Bevy decodes with), and the native file dialog of IMPORT.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
rfd = { version = "0.17", optional = true }
# Editor only: reads glTF models on the CPU (hierarchy browser, MCP
# `describe_model`, checks against the preview model). The same crate and
# features Bevy's glTF loader already compiles, so nothing new is built.
gltf = { version = "1.4", default-features = false, features = ["names", "utils", "extras", "extensions"], optional = true }

[dev-dependencies]
# WGSL validation of the effect shader in a test (the version and features
# Bevy's renderer already builds).
naga = { version = "29", features = ["wgsl-in"] }

[features]
# `bevy/jpeg`: the editor imports and previews JPG textures. Games that use
# JPG textures enable Bevy's `jpeg` feature themselves (PNG is a default).
editor = ["bevy_egui", "bevy_panorbit_camera", "regex", "serde_json", "image", "rfd", "gltf", "bevy/jpeg"]

[[bin]]
name = "omagari"
path = "src/main.rs"
required-features = ["editor"]

[lib]
name = "omagari"
path = "src/lib.rs"
